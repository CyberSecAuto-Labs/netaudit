name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install dev dependencies
        run: pip install -e ".[dev]"
      - name: ruff check
        run: ruff check .
      - name: ruff format
        run: ruff format --check .
      - name: mypy
        run: mypy netaudit/
      - name: Install docs dependencies
        run: pip install -e ".[docs]"
      - name: mkdocs build
        run: mkdocs build --strict

  test:
    name: Test (Python ${{ matrix.python-version }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dev dependencies
        run: pip install -e ".[dev]"
      - name: Run tests
        run: pytest -m 'not integration' --cov=netaudit --cov-fail-under=80

  integration:
    name: Integration Tests (strace)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install strace
        run: sudo apt-get install -y strace
      - name: Install dev dependencies
        run: pip install -e ".[dev]"
      - name: Run integration tests
        run: pytest -m integration -v

  docker:
    name: Docker smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build image
        run: docker build -t netaudit:ci .
      # Connects to TEST-NET-1 (RFC 5737) — unroutable, so the connect() is
      # traced without depending on external network. Reporter.check ignores
      # the syscall result, so a failed connect is still a violation.
      - name: Smoke test — egress is detected and fails the run
        run: |
          set +e
          out=$(docker run --rm --cap-add SYS_PTRACE netaudit:ci run -- \
            python -c 'import socket; s = socket.socket(); s.settimeout(2); s.connect_ex(("192.0.2.1", 443))')
          code=$?
          set -e
          echo "$out"
          if [ "$code" -ne 83 ]; then
            echo "::error::expected exit 83 (violations), got $code"
            exit 1
          fi
          if ! grep -q "192.0.2.1" <<<"$out"; then
            echo "::error::violation for 192.0.2.1 not reported"
            exit 1
          fi

      - name: Smoke test — a command with no egress exits clean
        run: |
          docker run --rm --cap-add SYS_PTRACE netaudit:ci \
            run -- python -c 'print("no egress")'

      - name: Smoke test — a failing command's exit code is not swallowed
        run: |
          set +e
          docker run --rm --cap-add SYS_PTRACE netaudit:ci \
            run -- python -c 'import sys; sys.exit(42)'
          code=$?
          set -e
          if [ "$code" -ne 42 ]; then
            echo "::error::expected the traced command's exit code 42, got $code"
            exit 1
          fi
