name: Release

on:
  release:
    types: [published]

jobs:
  pypi:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Check the tag matches the declared version
        # The build reads the tree, never the tag, so a release cut without a
        # version bump silently rebuilds the previous release and only fails at
        # upload — after the release is already public. Catch it here instead.
        run: |
          tag="${GITHUB_REF_NAME#v}"
          project=$(python -c 'import pathlib, tomllib; print(tomllib.loads(pathlib.Path("pyproject.toml").read_text())["project"]["version"])')
          dunder=$(python -c 'import pathlib, re; print(re.search(r"^__version__ = \"(.+)\"$", pathlib.Path("netaudit/__init__.py").read_text(), re.M).group(1))')
          echo "tag=$tag pyproject.toml=$project __init__.py=$dunder"
          if [ "$tag" != "$project" ] || [ "$tag" != "$dunder" ]; then
            echo "::error::version mismatch — tag v$tag, pyproject.toml $project, __init__.py $dunder"
            exit 1
          fi
      - name: Install build
        run: pip install build
      - name: Build distribution
        run: python -m build
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

  docker:
    name: Build and push Docker image to GHCR
    runs-on: ubuntu-latest
    needs: pypi
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest
      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
